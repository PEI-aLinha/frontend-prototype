name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload build and activate it
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          : "${DEPLOY_HOST:?Missing repository secret DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing repository secret DEPLOY_USER}"
          : "${DEPLOY_PATH:?Missing repository variable DEPLOY_PATH}"
          : "${GITHUB_SHA:?Missing commit SHA}"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "DEPLOY_HOST must be a hostname or IP only (no user, scheme, or port)." >&2; exit 2; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "DEPLOY_USER must be a single SSH username." >&2; exit 2; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9/_-]+$ ]] || { echo "DEPLOY_PATH must be an absolute path containing only letters, numbers, /, _ or -." >&2; exit 2; }
          target="$DEPLOY_USER@$DEPLOY_HOST"
          release="$DEPLOY_PATH/releases/$GITHUB_SHA"
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "$target" "mkdir -p '$release'"
          rsync -az --delete -e "ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key" dist/ "$target:$release/"
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "$target" \
            "ln -sfn 'releases/$GITHUB_SHA' '$DEPLOY_PATH/current.next' && mv -Tf '$DEPLOY_PATH/current.next' '$DEPLOY_PATH/current'"
