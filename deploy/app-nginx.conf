server {
    listen 80;
    server_name _;
    root /srv/current;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
