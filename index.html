<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="aLinha · Riscos e Ativos: inventário de ativos, registo de riscos ISO/IEC 27005 e avaliação de maturidade NIS2 para PME." />
    <meta name="theme-color" content="#0b4f4a" />
    <script>
      // Apply the saved appearance before first paint (no light flash in dark mode).
      try {
        var t = localStorage.getItem('appearance.theme') || 'system'
        var c = localStorage.getItem('appearance.cvd')
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (c && c !== 'none') document.documentElement.dataset.cvd = c
      } catch (e) {}
    </script>
    <title>aLinha · Riscos e Ativos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
